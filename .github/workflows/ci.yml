name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Validate dependencies
        run: npm run validate:dependencies

      - name: Validate manifests
        run: npm run validate:manifests

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run check

      - name: Validate build
        run: npm run validate:build

      - name: Validate Wrangler configuration
        run: npm run validate:wrangler
